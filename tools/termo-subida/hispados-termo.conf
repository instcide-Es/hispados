; (TERMO) Pool propio de PHP-FPM para el receptor de «Enviar a Carlos» del
; Termómetro (subir.php). Va en /www/server/php/83/etc/php-fpm.d/.
; Usuario de sistema propio (hispatermo), como el de jubilats: un fallo en
; subir.php NO corre como «www», no ve /www/wwwroot ni /etc/clicgest, y solo
; puede escribir en /www/hispados-subidas.
[hispados-termo]
listen = /tmp/php-cgi-83-hispados-termo.sock
listen.owner = www
listen.group = www
listen.mode = 0600
user = hispatermo
group = hispatermo
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 200
request_terminate_timeout = 60
php_admin_value[open_basedir] = /www/hispados-termo/:/www/hispados-subidas/:/etc/hispados-termo/:/tmp/
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 6M
php_admin_value[max_file_uploads] = 1
php_admin_value[memory_limit] = 32M
php_admin_value[disable_functions] = passthru,exec,system,putenv,chroot,chgrp,chown,shell_exec,popen,proc_open,pcntl_exec,ini_alter,ini_restore,dl,openlog,syslog,readlink,symlink,link,popepassthru,mail,curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[display_errors] = off
