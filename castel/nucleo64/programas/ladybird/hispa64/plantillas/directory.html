<!doctype html>
<!-- Hispa-64, etapa 10 i (docs/64/HISPA-64.md, sección 26): la plantilla de las carpetas
     (file:///...) de Ladybird (Base/res/ladybird/templates/directory.html, BSD-2), en español. -->
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Carpeta %path%</title>
        <style>
            html {
                color-scheme: light dark;
            }

            header {
                margin-bottom: 10px;
            }

            h1 {
                display: inline;
            }

            a {
                text-decoration: none;
            }

            a:focus,
            a:hover {
                text-decoration: underline;
            }

            table {
                font-family: monospace;
            }

            .folder,
            .file,
            .open-parent {
                display: inline-block;
                width: 16px;
                height: 16px;
                margin-right: 5px;
                background-size: contain;
            }

            .folder {
                background-image: url("resource://icons/32x32/filetype-folder.png");
            }

            .file {
                background-image: url("resource://icons/32x32/filetype-unknown.png");
            }

            .open-parent {
                background-image: url("resource://icons/16x16/open-parent-directory.png");
            }
        </style>
    </head>
    <body>
        <header>
            <span class="folder" style="width: 24px; height: 24px"></span>
            <h1>Carpeta %path%</h1>
        </header>
        <p>
            <a href="%parent_url%"><span class="open-parent"></span>Subir a la carpeta de arriba</a>
        </p>
        <hr />
        %contents%
        <hr />
    </body>
</html>
