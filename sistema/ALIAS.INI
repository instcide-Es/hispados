; ALIAS.INI de Hispa-DOS: otros nombres para las órdenes
;
;   NOMBRE=PROGRAMA
;
; Si escribe NOMBRE y no hay ningún programa que se llame así, se ejecuta
; PROGRAMA (que se busca en la carpeta actual y en el PATH). Puede añadir
; los suyos. Las líneas que empiezan por ; son comentarios.

; nombres clásicos (en inglés) de los programas de Hispa-DOS
EDIT=EDITAR
FDISK=PARTIR
FORMAT=FORMATEA
SYS=SISTEMA
KEYB=TECLADO
PLAYWAV=SONAR
SYSINFO=INFO
HISPASHELL=GESTOR
MOVE=MOVER
ATTRIB=ATRIBUTO
TREE=ARBOL
FIND=BUSCAR
SORT=ORDENAR
MORE=PAGINAR
CHOICE=ELEGIR
EXPAND=EXPANDIR
LABEL=ETIQUETA
XCOPY=XCOPIAR
CHKDSK=REVISAR
IPCONFIG=CONFRED
; VELOCIDAD no necesita línea: el programa es VELOCIDA.COM (los nombres de
; DOS tienen 8 letras) y el intérprete corta lo que se escribe a 8 letras.
; Lo mismo PROTECTOR (el protector de pantalla), que es PROTECTO.COM.
; Lo mismo con DESCARGAR (DESCARGA.COM).
