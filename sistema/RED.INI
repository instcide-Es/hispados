; RED.INI de Hispa-DOS: la configuración de la red (docs/RED.md)
;
; La leen CONFRED (IPCONFIG), PING y DESCARGAR la primera vez; después la
; guarda HSPRED en la memoria y la usan todos. Para cambiarla: CONFRED
; /RENOVAR (o reiniciar).
;
; Lo normal es DHCP=SI: el router de casa da la dirección, la máscara, la
; puerta de enlace y el servidor DNS.
DHCP=SI
;
; Para ponerla a mano: DHCP=NO y las cuatro líneas (quitando el «;»):
;IP=192.168.1.50
;MASCARA=255.255.255.0
;PUERTA=192.168.1.1
;DNS=192.168.1.1
;
; Con DHCP=SI, una línea DNS= manda sobre el servidor DNS que da el DHCP.
;
; Cable o Wi-Fi (Hispa-486, o con HSPRED /AUTO y HSPWIFI /AUTO en el
; AUTOEXEC.BAT): Preferir=AUTO (lo normal: el cable si está enchufado al
; arrancar y, si no, el Wi-Fi), CABLE (siempre el cable) o WIFI (siempre el
; Wi-Fi). En Hispa Ventanas se elige en el icono de la red («Usar:»). Vale
; al reiniciar.
;Preferir=AUTO
;
; ACTUALIZAR mira por HTTP si hay una versión más nueva del sistema. Aquí se
; puede poner la dirección del archivo de versión (si no, usa una de por
; omisión). Tiene que ser http:// (no https://: no hay cifrado todavía).
;ACTUALIZAR=http://actualiza.hispados.es/ultima.txt
