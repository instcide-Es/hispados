; RED.INI de Hispa-DOS: la configuración de la red (docs/RED.md)
;
; La leen CONFRED (IPCONFIG), PING y DESCARGAR la primera vez; después la
; guarda HSPRED en la memoria y la usan todos. Para cambiarla: CONFRED
; /RENOVAR (o reiniciar).
;
; Lo normal es DHCP=SI: el router de casa da la dirección, la máscara, la
; puerta de enlace y el servidor DNS.
DHCP=SI
;
; Para ponerla a mano: DHCP=NO y las cuatro líneas (quitando el «;»):
;IP=192.168.1.50
;MASCARA=255.255.255.0
;PUERTA=192.168.1.1
;DNS=192.168.1.1
;
; Con DHCP=SI, una línea DNS= manda sobre el servidor DNS que da el DHCP.
