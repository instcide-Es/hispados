; TECLAS.INI de Hispa-DOS: remapeo de teclas (lo lee TECLADO/KEYB al cargarse)
;
; Sirve para arreglar teclados raros de portátiles: una tecla que manda un
; código que no es el habitual se puede convertir en otra. Es por equipo (vive
; en esta máquina) y, al ser un *.INI, el instalador por red lo conserva en
; cada actualización.
;
; Cada línea es un remapeo «origen=destino»: ambos son códigos de rastreo
; «make» en HEXADECIMAL. El origen es la tecla tal como la manda el teclado; el
; destino es lo que quiere que haga.
;
;   5B=1D     la tecla cuyo make es 5B actúa como Ctrl izquierdo (1D)
;   E05B=1D   igual, pero para una tecla EXTENDIDA (su código va con el
;             prefijo E0): se escribe el E0 delante, cuatro cifras
;
; Al soltar la tecla (break = make + 80) el cambio se aplica solo; no hay que
; poner nada más. Para que el destino sea una tecla modificadora de verdad
; (Ctrl 1D, Mayús 2A o 36, Alt 38) y actualice las banderas, use su código make.
;
; Las líneas en blanco y las que empiezan por ; o # no cuentan. Caben hasta 32
; remapeos. Después de cambiar algo, reinicie (TECLADO lo lee al arrancar).
;
; Para averiguar el código de rastreo de una tecla, use TECLA: la pulsa y
; enseña su código en hexadecimal (y si lleva el prefijo E0).
;
; Códigos make útiles:
;   1D = Ctrl   2A = Mayús izq   36 = Mayús der   38 = Alt   3A = Bloq Mayús
;   01 = Esc    0E = Retroceso   0F = Tab         1C = Intro  39 = Espacio
;
; Ejemplos (quite el «;» del que necesite):
;
; La tecla Windows izquierda (E0 5B) de muchos portátiles como Ctrl izquierdo:
;E05B=1D
;
; Una tecla rara que manda 5D convertida en Alt:
;5D=38
;
; Por omisión no hay ningún remapeo activo: así no se cambia el teclado de nadie.
