; Son los grupos que crea Hispa Ventanas la primera vez, más el grupo «Hispa32»
; con los programas de 32 bits de C:\HISPA32 y el grupo «Internet» con el
; Navegador (C:\HISPADOS\INTERNET; Internet=1: Hispa Ventanas no lo vuelve a
; crear), y el grupo «Escritorio» (Escritorio=1: sus accesos son los iconos del
; escritorio de Hispa-486 y no salen en el menú Inicio) con «Biblioteca», que
; abre el Navegador en la biblioteca de ClicGest (su dirección va en
; Parametros=; la página de inicio de NAVEGA.INI es Google; M11). mkusb.py
; quita los accesos a programas que no estén en la imagen y, si falta el
; acceso de algún módulo .HVP, pone Modulos=0 para que Hispa Ventanas lo añada
; solo al arrancar.
; Formato: docs/VENTANAS.md, «CENTRO.INI». Página 437 y CR+LF en la imagen.

