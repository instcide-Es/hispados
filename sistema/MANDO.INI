; MANDO.INI de Hispa-DOS: los mandos de juego (lo lee HSPJOY al cargarse)
;
; Sin tocar nada, HSPJOY usa los mandos USB (con HSPUSB) y el del puerto de
; juegos, y los juegos los ven como el mando clásico (jugador 1 = mando A).
; Después de cambiar algo aquí, escriba HSPJOY otra vez. MANDO enseña los
; mandos que hay; MANDO /VER, lo que hacen. Las líneas con ; no cuentan.

[mandos]
; Quién es cada jugador: auto (por orden: USB, puerto de juegos, impresora),
; ninguno, usb1, usb2, juegos1, juegos2, lpt1 o lpt2.
;jugador1=auto
;jugador2=auto

; Mando conectado al puerto de impresora con un cable casero (los esquemas
; están en la documentación, MANDOS.md): atari (joystick Atari/Commodore/
; Amstrad/MSX de 9 patillas), megadrive, nes, snes o psx (PlayStation).
;lpt=nes
; Puerto: 1 = LPT1, 2 = LPT2, 3 = LPT3. Mandos en el cable (nes, snes, psx): 1 o 2.
;puerto=1
;lpt_mandos=1

; juegos=no para no mirar el puerto de juegos (201h).
;juegos=si

; Mando a teclado, para los juegos que solo saben de teclas: a cada dirección
; y a cada botón, una tecla. Teclas: letras y cifras, ARRIBA ABAJO IZQUIERDA
; DERECHA INTRO ESC ESPACIO CTRL ALT MAYUS TAB RETROCESO INSERT SUPR INICIO
; FIN REPAG AVPAG y F1 a F12. Quite los ; de la sección para activarla.
;[teclas1]
;arriba=ARRIBA
;abajo=ABAJO
;izquierda=IZQUIERDA
;derecha=DERECHA
;boton1=CTRL
;boton2=ALT
;boton3=ESPACIO
;boton4=INTRO
;boton10=ESC

; Lo mismo para el segundo jugador.
;[teclas2]
;arriba=W
;abajo=S
;izquierda=A
;derecha=D
;boton1=Q
;boton2=E

; La calibración del mando del puerto de juegos la escribe MANDO /CALIBRAR
; al final de este fichero (línea calibrar=).
