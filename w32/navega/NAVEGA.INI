; NAVEGA.INI: los ajustes del Navegador de Hispa-486 (docs/486/NAVEGADOR.md)
;
; Inicio=direccion        la pagina con la que arranca y la del boton Inicio
;                         (si no se dice, la de bienvenida: about:inicio)
; Idioma=es               el idioma que se pide a las paginas (es, ca, en...)
; AlContenido=NO          no saltar a lo principal de la pagina al abrirla
; Favorito=nombre|direccion   una linea por cada enlace de la pagina de inicio
; Descargas=C:\DOCUMEN   la carpeta de lo que se baja (si no se dice,
;                         \HISPADOS\INTERNET\DESCARGA): un PDF va ahi sin
;                         preguntar y se abre con el Lector
; Galletas=NO             no guardar las galletas al cerrar (equipos de todos):
;                         habra que entrar con la clave cada vez
; JavaScript=NO          sin JavaScript (por omision, con: HSPJS.DLL)
; TiempoJS=15            segundos que puede tardar un guion antes de pararlo
; MemoriaJS=7168         KB que puede usar el JavaScript de una pagina
;
; La pagina de inicio: la biblioteca de ClicGest (la abre el icono
; Biblioteca del escritorio de Hispa-486, sistema/486/CENTRO.INI)
Inicio=https://clicgest.es/biblioteca
Idioma=es
Favorito=ClicGest: la biblioteca|https://clicgest.es/biblioteca
